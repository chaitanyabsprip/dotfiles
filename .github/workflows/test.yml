name: Test

# PRs only — running the full build+vet+test suite on every push is
# redundant with this, since a push either becomes a PR (tested here) or
# is direct-to-branch (covered by build.yml's cheaper artifact-only
# check instead).
on:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
